<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f8fd4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ПОГОДА+</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0e151d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:#17212e;position:relative;overflow:hidden}

/* ---------- сцена ---------- */
#scene{position:relative;flex:1 1 auto;min-height:250px;overflow:hidden;transition:filter .8s}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 1.1s}
.sky.on{opacity:1}
#stars{position:absolute;inset:0 0 40% 0;opacity:0;transition:opacity 1.2s}
#stars i{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#sun,#moon{position:absolute;opacity:0;transition:opacity 1.2s;pointer-events:none}
#sun{top:7%;right:8%;width:96px;height:96px}
#sun .rays{position:absolute;inset:-60px;border-radius:50%;background:repeating-conic-gradient(rgba(255,243,176,.42) 0 7deg,transparent 7deg 21deg);-webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);animation:spin 70s linear infinite}
#sun .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fffbd0,#ffd84d 60%,#ffb703);box-shadow:0 0 50px 18px rgba(255,214,79,.55)}
@keyframes spin{to{transform:rotate(360deg)}}
#moon{top:8%;right:10%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffdf0,#f1e8b8 70%);box-shadow:0 0 36px 10px rgba(255,248,200,.35)}
#moon:before,#moon:after{content:"";position:absolute;border-radius:50%;background:rgba(190,175,120,.35)}
#moon:before{width:14px;height:14px;left:34px;top:14px}
#moon:after{width:9px;height:9px;left:16px;top:38px}
#clouds,#fogs{position:absolute;inset:0;pointer-events:none}
#scene.night #clouds{filter:brightness(.42)}
.cloud{position:absolute;left:0;will-change:transform;animation:drift linear infinite}
.cloud svg{display:block;width:100%;height:auto;fill:currentColor}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(var(--sw,700px))}}
.fog{position:absolute;left:-20%;width:140%;height:20%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);filter:blur(16px);animation:fogm 16s ease-in-out infinite alternate}
@keyframes fogm{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
#fogs{opacity:0;transition:opacity 1.2s}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ground{position:absolute;left:-10%;right:-10%;bottom:0;height:15%;border-radius:50% 50% 0 0/26px 26px 0 0;transition:background 1s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}

.charwrap{position:absolute;right:-3%;bottom:4%;height:calc(80% * var(--k,1));z-index:3;max-width:92%;cursor:pointer}
.charwrap.wide{height:auto;width:72%;max-width:72%}
.charwrap.housepic{height:auto;width:44%;max-width:44%;right:4%;bottom:5%}
.charwrap:after{content:"";position:absolute;left:8%;right:8%;bottom:-2.5%;height:6%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.34),transparent 70%);z-index:-1}
.charwrap img{height:100%;width:100%;object-fit:contain;object-position:50% 100%;display:block;transform-origin:50% 100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.charwrap.pop img{animation:pop .45s ease-out,var(--anim,idle) var(--dur,4s) ease-in-out .45s infinite}
.a-idle{--anim:idle;--dur:4s}.a-sway{--anim:sway;--dur:3.2s}.a-shiver{--anim:shiver;--dur:1.3s}.a-ride{--anim:ride;--dur:2.4s}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(14px)}to{opacity:1;transform:none}}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(1.012,.995)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(1.6deg) translateY(-5px)}}
@keyframes ride{0%,100%{transform:translateX(-6px) rotate(-.8deg)}50%{transform:translateX(6px) rotate(.8deg) translateY(-3px)}}
@keyframes shiver{0%,55%,100%{transform:translateX(0)}60%{transform:translateX(-2.5px)}65%{transform:translateX(2.5px)}70%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}80%{transform:translateX(-1.5px)}85%{transform:translateX(0)}}

.hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 0;text-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none}
#when{font-size:clamp(26px,7.4vw,34px);font-weight:800;line-height:1.1}
#whenSub{font-size:clamp(15px,4.2vw,18px);opacity:.95;margin-top:2px}
#temp{font-size:clamp(84px,27vw,132px);font-weight:800;line-height:1;margin-top:6px;letter-spacing:-2px}
#label{font-size:clamp(24px,6.8vw,32px);font-weight:700;line-height:1.15;margin-top:2px}
#hint{font-size:clamp(17px,4.8vw,21px);font-weight:600;margin-top:6px;max-width:50%;line-height:1.25}
#status{position:absolute;left:12px;bottom:calc(15% + 6px);z-index:7;font-size:12px;opacity:.8;text-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}
#status.warn{color:#ffd27a;opacity:1}
@keyframes say{0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 8px rgba(232,93,58,.35)}}
.demobar2{display:none;gap:6px;padding:0 8px 6px;background:#0b1118;overflow-x:auto;flex:0 0 auto;align-items:center}
.demobar2.show{display:flex}
.demobar2 button{background:#3b3358;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.demobar2 button.on{background:#f2b705;color:#2a2000}

/* ---------- низ ---------- */
.info{display:flex;gap:8px;padding:10px 12px 6px;background:#17212e}
.chip{flex:1;background:#223244;border-radius:14px;padding:7px 6px;text-align:center;min-width:0}
.chip small{display:block;font-size:13px;color:#9db4cc}
.chip b{font-size:clamp(19px,5.4vw,24px);font-weight:700;white-space:nowrap}
.quick{display:flex;gap:8px;padding:4px 12px 10px;background:#17212e}
.quick button{flex:1;height:56px;border-radius:16px;background:#2c4766;font-size:clamp(15px,4.4vw,18px);font-weight:700;line-height:1.1;padding:0 4px;transition:background .2s,transform .1s}
.quick button:active{transform:scale(.96)}
.quick button.on{background:#f2b705;color:#2a2000}
.wall{position:relative;display:flex;justify-content:space-around;align-items:flex-end;padding:14px 10px 12px;background:repeating-linear-gradient(90deg,#ecdfc6 0 26px,#e6d7bb 26px 52px);border-top:6px solid #7a5532;color:#4a3320;flex:0 0 auto}
.hang{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;font-weight:700}
.hang:before{content:"";width:8px;height:8px;border-radius:50%;background:#8a8a8a;box-shadow:0 1px 2px rgba(0,0,0,.4);margin-bottom:-4px;order:-1}
.cal{width:112px;border-radius:8px;background:#fffdf6;box-shadow:0 5px 12px rgba(60,40,10,.35);overflow:hidden;transform:rotate(-2deg);text-align:center;color:#2b2b2b}
.cal .top{background:#d63a33;color:#fff;font-weight:800;font-size:15px;letter-spacing:1px;padding:6px 0 4px;position:relative}
.cal .top:before,.cal .top:after{content:"";position:absolute;top:-4px;width:9px;height:12px;border-radius:5px;background:#555}
.cal .top:before{left:20px}.cal .top:after{right:20px}
.cal .d{font-size:68px;font-weight:800;line-height:1}
.cal .w{font-size:15px;font-weight:700;padding-bottom:6px;color:#555}
.clk{width:112px;height:112px;filter:drop-shadow(0 5px 8px rgba(60,40,10,.4))}
.clk svg{width:100%;height:100%;display:block}
.hh,.mm{transform-origin:60px 60px;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.pulse .cal,.pulse .clk{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{scale:1}50%{scale:1.06}}

/* ---------- окно выбора ---------- */
#modal{position:fixed;inset:0;background:rgba(5,10,18,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:#fdf8ee;color:#2a2418;border-radius:26px 26px 0 0;padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 16px);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:26px;text-align:center;margin-bottom:12px}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e5d9bd;border-radius:16px;padding:10px 14px;text-align:left;min-height:64px}
.day.on,.hr.on{background:#f2b705;border-color:#c99200}
.day .em{font-size:32px}
.day .t{flex:1;font-size:21px;font-weight:800;line-height:1.15}
.day .t small{display:block;font-size:15px;font-weight:600;color:#6d5f43}
.day .r{font-size:19px;font-weight:800;white-space:nowrap}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hr{background:#fff;border:2px solid #e5d9bd;border-radius:14px;padding:8px 2px;text-align:center;min-height:78px}
.hr b{display:block;font-size:22px}
.hr span{font-size:16px;font-weight:700;color:#5a4d33}
.hr:disabled{opacity:.3}
.close{display:block;margin:14px auto 0;padding:12px 40px;background:#e5d9bd;border-radius:16px;font-size:19px;font-weight:700}

/* ---------- состояния ---------- */
#over{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:30px;background:rgba(20,30,45,.88);font-size:24px;font-weight:700}
#over.show{display:flex}
#over button{background:#f2b705;color:#2a2000;padding:14px 34px;border-radius:16px;font-size:21px;font-weight:800}
.demobar{display:none;gap:6px;padding:6px 8px;background:#0b1118;overflow-x:auto;flex:0 0 auto;align-items:center}
.demobar.show{display:flex}
.demobar span{font-size:12px;color:#f2b705;font-weight:800;white-space:nowrap}
.demobar button{background:#2c4766;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.demobar button.on{background:#f2b705;color:#2a2000}

:root{--cw:min(156px,41vw)}
.chip.say{flex:1;background:#d6362b;border-radius:14px;display:flex;align-items:center;justify-content:center;min-width:0;padding:0;color:#fff;transition:transform .1s}
.chip.say:active{transform:scale(.95)}
.chip.say svg{width:40px;height:40px}
.chip.say.on{background:#a8271e;animation:say 1.4s ease-in-out infinite}
.wall{padding:12px 4px 10px;gap:2px}
.hang{font-size:13px;text-align:center}
.cal{width:var(--cw);border-radius:12px}
.cal .top{font-size:calc(var(--cw)*.115);padding:calc(var(--cw)*.035) 0 calc(var(--cw)*.025)}
.cal .d{font-size:calc(var(--cw)*.78);line-height:.9;font-weight:900;letter-spacing:-.05em}
.cal .w{font-size:calc(var(--cw)*.12);padding-bottom:calc(var(--cw)*.04)}
.clk{width:min(96px,25vw);height:min(96px,25vw)}
.locbtn .ico{width:min(78px,21vw);height:min(112px,29vw);display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 4px 6px rgba(60,40,10,.35))}
.locbtn .ico img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.locbtn .ico svg{width:100%;height:100%}
#scene.light .hud{color:#0d2b45;text-shadow:0 1px 8px rgba(255,255,255,.65)}
#scene.light #status{color:#1b3550;text-shadow:0 1px 4px rgba(255,255,255,.6);opacity:.9}
#scene.light #status.warn{color:#8a4b00}
@media (max-height:700px){:root{--cw:min(128px,35vw)}.clk{width:min(84px,23vw);height:min(84px,23vw)}.locbtn .ico{height:min(92px,25vw)}.chip small{font-size:12px}.quick button{height:50px}}
@media (max-height:660px){#hint{display:none}}
.hang#clkBtn{transform:translateY(-54px)}
.quick.five{gap:6px}.quick.five button{font-size:clamp(12px,3.8vw,16px);padding:0 2px}
</style>
</head>
<body>
<div id="app">
  <div class="demobar" id="demobar"></div>
  <div class="demobar2" id="demobar2"></div>
  <div id="scene">
    <div class="sky" id="skyA"></div><div class="sky" id="skyB"></div>
    <div id="stars"></div>
    <div id="sun"><div class="rays"></div><div class="disc"></div></div>
    <div id="moon"></div>
    <div id="clouds"></div>
    <div id="fogs"><div class="fog" style="top:42%"></div><div class="fog" style="top:55%;animation-duration:22s"></div><div class="fog" style="top:68%;animation-duration:13s"></div></div>
    <canvas id="fx"></canvas>
    <div id="ground"></div>
    <div class="charwrap" id="charwrap"><img id="char" alt=""></div>
    <div class="hud">
      <div id="when"></div>
      <div id="whenSub"></div>
      <div id="temp"></div>
      <div id="label"></div>
      <div id="hint"></div>
    </div>
    <div id="status"></div>
    <div id="flash"></div>
    <div id="over"></div>
  </div>
  <div class="info">
    <div class="chip"><small>Ощущается</small><b id="cFeel">—</b></div>
    <button class="chip say" id="say" aria-label="Послушать прогноз"><svg viewBox="0 0 24 24" fill="#fff" id="sayIcon"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="chip"><small>Осадки</small><b id="cPop">—</b></div>
  </div>
  <div class="quick" id="quick"></div>
  <div class="wall pulse" id="wall">
    <button class="hang" id="calBtn" aria-label="Выбрать день">
      <div class="cal"><div class="top" id="calM">НОЯБРЬ</div><div class="d" id="calD">5</div><div class="w" id="calW">четверг</div></div>
      Выбрать день
    </button>
    <button class="hang locbtn" id="locBtn" aria-label="Переключить место"><div class="ico" id="locIco"></div><span id="locTxt">Наван</span></button>
    <button class="hang" id="clkBtn" aria-label="Выбрать время">
      <div class="clk">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="55" fill="#fffaf0" stroke="#7a4f2a" stroke-width="7"/>
          <g id="ticks" stroke="#3b2c1c" stroke-linecap="round"></g>
          <g font-family="system-ui,Arial" font-weight="800" font-size="17" text-anchor="middle" fill="#3b2c1c">
            <text x="60" y="30">12</text><text x="95" y="66">3</text><text x="60" y="102">6</text><text x="25" y="66">9</text>
          </g>
          <g class="hh" id="hh"><line x1="60" y1="64" x2="60" y2="35" stroke="#2a1d10" stroke-width="6" stroke-linecap="round"/></g>
          <g class="mm" id="mm"><line x1="60" y1="66" x2="60" y2="22" stroke="#2a1d10" stroke-width="4" stroke-linecap="round"/></g>
          <circle cx="60" cy="60" r="5" fill="#d63a33"/>
        </svg>
      </div>
      Выбрать время
    </button>
  </div>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* ============ НАСТРОЙКИ ============ */
/* Два места: Шатура (Лотос) — по умолчанию, и Наван (графство Мит, Ирландия). Переключаются кнопкой у календаря. */
const LOCS={
  shatura:{name:"Шатура",lat:55.544993,lon:39.482780,tz:"Europe/Moscow"},
  navan:{name:"Наван",lat:53.6528,lon:-6.6814,tz:"Europe/Dublin"}
};
const IRELAND=false;   // true — версия для нас (есть клевер и погода Навана), false — версия для родителей
let LOC="shatura";
const CONFIG={...LOCS.shatura,dublinTz:"Europe/Dublin"};
const AUTOPLAY={from:7,to:22};   // автозапуск голоса при открытии — только в эти часы по Москве

/* ---- Дни рождения (день, месяц). who — чья картинка (null = любой из семьи).
        voice — какую озвучку проиграть перед прогнозом (если несколько — выберется случайная). ---- */
const BIRTHDAYS=[
  {d:27,m:11,who:"mama",voice:["den_rozhdeniya_babushka","pozdravlyaem_babushka"]},
  {d:21,m:12,who:"ya"},
  {d:10,m:2,who:null},
  {d:15,m:3,who:"nastya"},
  {d:31,m:3,who:"lusya"},
  {d:2,m:4,who:null},
  {d:20,m:7,who:"muzh"},
  {d:13,m:10,who:"papa",voice:["den_rozhdeniya_dedushka"]},
  {d:21,m:10,who:null}
];
/* ---- Праздничные картинки по датам (включительно). Формат [месяц,день]. ---- */
const HOLIDAYS=[
  {from:[12,20],to:[12,24],files:["papa_elka.webp"]},
  {from:[12,25],to:[1,13],files:["papa_elka_naryadnaya.webp","mama_zima_elka.webp"]}
];
const JINGLE={from:[12,28],to:[1,5]};          // Jingle Bells фоном
const GREETINGS=[                               // поздравления голосом перед прогнозом
  {m:12,d:31,voice:"s_novym_godom"},{m:1,d:1,voice:"s_novym_godom"},{m:1,d:7,voice:"s_rozhdestvom"}
];
/* ---- Расписание. tz: "dublin" — время в Ирландии, "msk" — московское.
        days: 0=воскр, 1=пн … 6=суббота. Порядок важен: что выше, то главнее. ---- */
const SCHEDULE=[
  {tz:"msk",   days:[0,1,2,3,4,5,6],from:"12:00",to:"13:00",what:"bike"},    // каждый день: девушка на велосипеде с половником
  /* only:"ie" — только в ирландской версии, only:"ru" — только в версии для родителей; grp — записи одной группы показываются вместе */
  {only:"ru",tz:"dublin",days:[2],from:"17:00",to:"20:00",what:"ballet"},      // вторник: балет (версия для родителей)
  {only:"ie",grp:"ballet",tz:"dublin",days:[2],from:"16:30",to:"17:30",what:"balletL"}, // вторник: балет Люси
  {only:"ie",grp:"ballet",tz:"dublin",days:[2],from:"17:15",to:"18:45",what:"balletN"}, // вторник: балет Насти
  {tz:"dublin",days:[5],from:"16:00",to:"17:00",what:"drums"},                // пятница: Люся на барабанах
  {only:"ru",tz:"dublin",days:[5],from:"17:00",to:"18:00",what:"pool"},       // пятница: бассейн (версия для родителей)
  {only:"ie",grp:"fri",tz:"dublin",days:[5],from:"17:00",to:"20:00",what:"pool"},   // пятница вечером: Люся в бассейне
  {only:"ru",tz:"dublin",days:[5],from:"18:00",to:"20:00",what:"tennis"},     // пятница: Настя на теннисе (версия для родителей)
  {only:"ie",grp:"fri",tz:"dublin",days:[5],from:"18:00",to:"20:00",what:"tennis"},  // пятница: Настя на теннисе
  {tz:"dublin",days:[6],from:"09:00",to:"20:00",what:"tennis"}                // суббота: Настя на теннисе
];
/* ---- Границы времён суток (московское время) и час, по которому берётся прогноз для вкладки ---- */
const BUCKETS=[
  {name:"утром",start:6,at:8},{name:"днём",start:12,at:14},
  {name:"вечером",start:17,at:19},{name:"ночью",start:22,at:23}
];
const BIRCH={from:[3,1],to:[4,30]};            // берёзовый сок
const MUSHROOMS={from:[8,15],to:[11,15]}; // грибы

function mskNow(){
  if(DEMO_NOW)return DEMO_NOW;
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  return{date:`${g("year")}-${g("month")}-${g("day")}`,h:+g("hour"),m:+g("minute")};
}
const mskKey=()=>{const n=mskNow();return`${n.date}T${pad(n.h)}:00`};
function addDays(s,n){const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)}
function dParts(s){const[y,m,d]=s.split("-").map(Number);return{y,m,d,wd:new Date(Date.UTC(y,m-1,d,12)).getUTCDay()}}
function dayName(s){
  const t=mskNow().date;
  if(s===t)return"Сегодня";if(s===addDays(t,1))return"Завтра";if(s===addDays(t,2))return"Послезавтра";
  return cap(WD[dParts(s).wd]);
}
/* перевод времени между часовыми поясами */
function tzOff(ms,tz){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(ms));
  const g=t=>+p.find(x=>x.type===t).value;
  return Date.UTC(g("year"),g("month")-1,g("day"),g("hour"),g("minute"),g("second"))-Math.floor(ms/1000)*1000;
}
function instantOf(key,min,tz){ // «местное время в tz» -> момент времени
  const[ds,ts]=key.split("T"),{y,m,d}=dParts(ds),h=+ts.slice(0,2),guess=Date.UTC(y,m-1,d,h,min);
  let t=guess-tzOff(guess,tz);return guess-tzOff(t,tz);
}
function partsAt(ms,tz){ // день недели и минуты от начала суток в tz
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(ms));
  const g=t=>p.find(x=>x.type===t).value;
  return{dow:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),min:(+g("hour"))*60+(+g("minute"))};
}

function demoData(kind){
  const C={clear:[0,12,5,2],partly:[2,10,10,4],cloudy:[3,7,10,3],fog:[45,2,5,1],drizzle:[53,7,60,3],rain:[63,9,85,4],heavyrain:[82,12,100,7],snow:[73,-3,80,5],heavysnow:[75,-7,100,9],thunder:[95,19,90,8],frost:[0,-19,0,2]}[kind];
  const[code,base,pop,wind]=C,today=mskNow().date,o={time:[],temp:[],feels:[],pop:[],mm:[],code:[],cloud:[],wind:[],day:[]};
  for(let d=0;d<7;d++)for(let h=0;h<24;h++){
    const t=base+3.5*Math.sin((h-9)/24*2*Math.PI)+d*.3;
    o.time.push(`${addDays(today,d)}T${pad(h)}:00`);o.temp.push(t);o.feels.push(t-wind*.7);o.pop.push(pop);

}

    const j=await r.json();if(id!==LOC)return;
    DATA=parse(j);updatedAt=Date.now();offline=false;CACHE[id]={data:DATA,t:updatedAt,offline:false};
    safeSet("wx_cache_"+id,JSON.stringify({t:updatedAt,j}));

  }catch(e){
    if(id!==LOC)return;
    let c=null;try{c=JSON.parse(safeGet("wx_cache_"+id)||"null")}catch(_){}

}

    html+=`<button class="day${d===cur.d?" on":""}" data-d="${d}"><span class="em">${EMOJI[k][0]}</span><span class="t">${dayName(d)}<small>${p.d} ${MONTHS_G[p.m-1]}, ${WD[p.wd]}</small></span><span class="r">${fmtT(Math.min(...ts))} … ${fmtT(Math.max(...ts))}</span></button>`;
  });
  html+='</div><button class="close">Закрыть</button>';
  sheet.innerHTML=html;modal.classList.add("open");
  sheet.querySelectorAll(".day").forEach(b=>b.onclick=()=>{
    const d=b.dataset.d,n=mskNow();
    sel.exact=false;if(d===n.date)sel.now=true;else{sel.now=false;sel.key=`${d}T${pad(BUCKETS[0].at)}:00`}
    if(speaking)speaking.stop();closeModal();render();
  });
  sheet.querySelector(".close").onclick=closeModal;
}
function openHours(){
  unpulse();if(!DATA)return;
  const cur=curKeyParts(),n=mskNow();
  let html=`<h2>Какой час?<br><small style="font-size:18px;font-weight:600;color:#6d5f43">${dayName(cur.d)}</small></h2><div class="hours">`;
  for(let h=0;h<24;h++){
    const key=`${cur.d}T${pad(h)}:00`,i=DATA.time.indexOf(key);if(i<0)continue;
    const past=cur.d===n.date&&h<n.h,k=kindOf(DATA.code[i]);
    html+=`<button class="hr${h===cur.h&&!sel.now?" on":""}" data-h="${h}" ${past?"disabled":""}><b>${pad(h)}:00</b><span>${EMOJI[k][DATA.day[i]?0:1]} ${fmtT(DATA.temp[i])}</span></button>`;
  }
  html+='</div><button class="close">Закрыть</button>';
  sheet.innerHTML=html;modal.classList.add("open");
  sheet.querySelectorAll(".hr").forEach(b=>b.onclick=()=>{setSel(`${cur.d}T${pad(+b.dataset.h)}:00`);sel.exact=true;closeModal();render()});
  sheet.querySelector(".close").onclick=closeModal;
}

/* ============ ГОЛОС ДОЧКИ И ЗВУКИ ============ */
const SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const blobUrls=new Map();
async function audioUrl(name){
  if(blobUrls.has(name))return blobUrls.get(name);
  const r=await fetch("audio/"+name+".mp3");if(!r.ok)throw new Error("audio "+name);
  const u=URL.createObjectURL(await r.blob());blobUrls.set(name,u);return u;
}
/* «слоты» фраз: в каждом — варианты на выбор (случайный) */
function tempSlot(t){
  let r=Math.max(-35,Math.min(35,Math.round(t)));if(Object.is(r,-0))r=0;
  if(r===0)return["zero","zero_2"];
  if(r===1)return["p1","p1_alt"];if(r===4)return["p4","p4_alt"];
  return[(r>0?"p":"m")+Math.abs(r)];
}
function weatherSlots(c){
  const{code,kind,w,t,isDay}=c,S=[];
  if(code>=95){S.push(["silnaya_groza"]);if(code>=96)S.push(["grad"])}
  else if([56,57,66,67].includes(code)||(c.rainy&&t<=0&&t>=-4))S.push(["gololed_1","gololed_2","gololed_3"]);
  else if(kind==="heavyrain")S.push(["silnyj_dozhd_1","silnyj_dozhd_2"]);
  else if(kind==="rain"||kind==="drizzle")S.push(["dozhd"]);
  else if(kind==="heavysnow")S.push([w>=10?"metel":"silnyj_sneg"]);
  else if(kind==="snow")S.push([code===73?"snegopad":(w>=12?"metel":"sneg")]);
  else if(kind==="clear"&&isDay)S.push(["solnyshko_1","solnyshko_2"]);
  const metel=S.some(s=>s[0]==="metel");
  if(w>=10&&!metel)S.push(["silnyj_veter"]);
  return S;
}
function slotsFor(c){
  const S=[],b=birthdayAt(c),g=GREETINGS.find(x=>x.m===c.m&&x.d===c.d);
  if(b&&b.voice)S.push(b.voice);
  if(g)S.push([g.voice]);
  S.push(tempSlot(c.t),...weatherSlots(c));
  if(c.frost)S.push(["nakroite_ogurcy"]);
  return S;
}
/* фоновый звук: день рождения > Jingle Bells > погода */
function bgFor(c){
  if(birthdayAt(c))return{name:"happy_birthday",vol:.22};
  if(inRange(c.m,c.d,JINGLE))return{name:"jingle_bells",vol:.2};
  if(c.kind==="heavyrain"||c.thunder)return{name:"rain_heavy",vol:.16};
  if(c.rainy)return{name:"rain_light",vol:.16};
  if(c.kind==="heavysnow"||(c.snowy&&c.w>=12))return{name:"blizzard",vol:.16};
  if(c.w>=10)return{name:"wind",vol:.16};
  return null;
}
let speaking=null,ICON_PLAY=null;
function setSayUi(on){
  const b=$("#say"),ic=$("#sayIcon");if(!ICON_PLAY)ICON_PLAY=ic.innerHTML;
  b.classList.toggle("on",on);ic.innerHTML=on?'<rect x="6" y="6" width="12" height="12" rx="2"/>':ICON_PLAY;
}
function flashStatus(msg){const st=$("#status");st.textContent=msg;st.className="warn";setTimeout(()=>{if(DATA)render()},3500)}
function playOne(a,tok){return new Promise(res=>{tok.res=()=>res(true);a.onended=a.onerror=()=>res(true);a.play().catch(e=>{tok.blocked=!!(e&&e.name==="NotAllowedError");res(false)})})}
async function fadeOut(a){if(!a)return;for(let v=a.volume;v>.02;v-=.03){a.volume=Math.max(0,v);await sleep(45)}a.pause()}
async function speak(auto){
  if(speaking){speaking.stop();return}
  if(!LAST||!DATA)return;
  const c=LAST,tok={stopped:false,res:null,stop(){tok.stopped=true;tok.res&&tok.res()}};
  speaking=tok;setSayUi(true);
  const voice=new Audio();voice.src=SILENT;voice.play().catch(()=>{});   // разрешаем звук на телефоне
  let bg=null;
  try{
    const seq=slotsFor(c).map(rnd),b=bgFor(c);
    const urls=await Promise.all([...seq,...(b?[b.name]:[])].map(audioUrl));
    if(b){bg=new Audio(urls[seq.length]);bg.loop=true;bg.volume=b.vol;bg.play().catch(()=>{})}
    for(let k=0;k<seq.length&&!tok.stopped;k++){voice.src=urls[k];const ok=await playOne(voice,tok);if(!ok&&tok.blocked)break;if(!tok.stopped)await sleep(250)}
  }catch(e){flashStatus("Не получилось включить звук")}
  voice.pause();
  if(tok.stopped&&bg)bg.pause();else await fadeOut(bg);
  speaking=null;setSayUi(false);
  if(auto&&tok.blocked)armTap();   // телефон не разрешил звук сам — включим при первом касании
}
$("#say").onclick=()=>speak(false);
/* автозапуск при открытии (днём); если браузер не разрешил — при первом касании экрана */
let tapArmed=false;
function armTap(){
  if(tapArmed)return;tapArmed=true;
  const h=e=>{if(e.target.closest&&e.target.closest("#say"))return;document.removeEventListener("click",h,true);tapArmed=false;if(!speaking)speak(false)};
  document.addEventListener("click",h,true);
}
function autoSpeakSoon(){
  setTimeout(()=>{
    if(DEMO||speaking||!LAST)return;
    const h=partsAt(Date.now(),"Europe/Moscow").min/60;
    if(h<AUTOPLAY.from||h>=AUTOPLAY.to)return;
    speak(true);
  },700);
}
/* заранее подгружаем нужные фразы, чтобы они были в памяти телефона */
const warmed=new Set();let warmTimer=null;
function prefetchSoon(c){
  clearTimeout(warmTimer);
  warmTimer=setTimeout(async()=>{
    const b=bgFor(c),names=[...slotsFor(c).flat(),...(b?[b.name]:[])];
    for(const n of names){if(warmed.has(n))continue;warmed.add(n);try{await fetch("audio/"+n+".mp3")}catch(e){warmed.delete(n)}}
  },1500);
}
